springdoc.api-docs.version=OPENAPI_3_1
spring.mvc.throw-exception-if-no-handler-found=true
server.port=${PORT:8080}
music-kg.api.mode=fixture
music-kg.api.bff-shared-secret=${BACKEND_BFF_SHARED_SECRET:}
music-kg.api.cors.allowed-origins=http://localhost:3000
music-kg.api.max-payload-bytes=4096
music-kg.api.rate-limit.search-per-minute=${MUSIC_KG_SEARCH_RATE_LIMIT_PER_MINUTE:300}

# Connected mode is deliberately fail-closed: it cannot start without its
# server-side Notion credentials and a contactable MusicBrainz User-Agent.
music-kg.connected.mode=${MUSIC_KG_CONNECTED_MODE:connected}
music-kg.connected.read-only=${MUSIC_KG_CONNECTED_READ_ONLY:false}
music-kg.connected.notion.api-key=${NOTION_API_KEY:}
music-kg.connected.notion.data-source-id=${NOTION_DATA_SOURCE_ID:}
music-kg.connected.notion.fields.album-title=${NOTION_ALBUM_TITLE_FIELD:}
music-kg.connected.notion.fields.artist=${NOTION_ARTIST_FIELD:}
music-kg.connected.notion.fields.cover=${NOTION_COVER_FIELD:}
music-kg.connected.notion.fields.sentiment=${NOTION_SENTIMENT_FIELD:}
music-kg.connected.notion.fields.favourite-track=${NOTION_FAVOURITE_TRACK_FIELD:}
music-kg.connected.notion.fields.owned=${NOTION_OWNED_FIELD:}
music-kg.connected.notion.fields.release-group-mbid=${NOTION_RELEASE_GROUP_MBID_FIELD:}
music-kg.connected.notion.fields.release-mbid=${NOTION_RELEASE_MBID_FIELD:}
music-kg.connected.notion.fields.catalog-source=${NOTION_CATALOG_SOURCE_FIELD:}
music-kg.connected.notion.fields.catalog-id=${NOTION_CATALOG_ID_FIELD:}
music-kg.connected.notion.fields.youtube-recording-mbid=${NOTION_YOUTUBE_RECORDING_MBID_FIELD:}
music-kg.connected.notion.fields.youtube-video-id=${NOTION_YOUTUBE_VIDEO_ID_FIELD:}
music-kg.connected.notion.fields.youtube-video-title=${NOTION_YOUTUBE_VIDEO_TITLE_FIELD:}
music-kg.connected.notion.fields.youtube-channel-title=${NOTION_YOUTUBE_CHANNEL_TITLE_FIELD:}
music-kg.connected.music-brainz.user-agent=${MUSICBRAINZ_USER_AGENT:}
music-kg.connected.music-brainz.base-url=${MUSICBRAINZ_BASE_URL:https://musicbrainz.org/ws/2}
music-kg.connected.music-brainz.requests-per-second=${MUSICBRAINZ_REQUESTS_PER_SECOND:1}
music-kg.connected.music-brainz.cover-art-archive-base-url=${COVER_ART_ARCHIVE_BASE_URL:https://coverartarchive.org}
music-kg.connected.graph-db.base-url=${MUSIC_KG_GRAPHDB_BASE_URL:}
music-kg.connected.graph-db.repository=${MUSIC_KG_GRAPHDB_REPOSITORY:music-kg-personal}
music-kg.connected.llm.enabled=${MUSIC_KG_LLM_ENABLED:false}
music-kg.connected.llm.base-url=${MUSIC_KG_LLM_BASE_URL:https://api.openai.com/v1}
music-kg.connected.llm.api-key=${MUSIC_KG_LLM_API_KEY:}
music-kg.connected.llm.model=${MUSIC_KG_LLM_MODEL:}
