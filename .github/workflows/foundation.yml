name: foundation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.9'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - uses: pnpm/action-setup@v6
        with:
          version: '11.9.0'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.18.0'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.26'
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend typecheck
      - run: pnpm --dir frontend test
      - run: pnpm --dir frontend build
      - run: node scripts/test-validate-cloud-run-manifest.mjs
      - run: pwsh -NoLogo -NoProfile -File scripts/test-run-connected-smoke.ps1
      - run: pwsh -NoLogo -NoProfile -File scripts/test-run-connected-notion-e2e.ps1
      - run: bash backend/gradlew -p backend test --no-daemon
      - run: uv run --directory pipeline --group dev pytest tests
      - run: docker compose config
      - run: git diff --check
      - run: bash scripts/verify-supply-chain.sh
      - run: bash scripts/test-verify-supply-chain-redaction.sh
      - run: bash scripts/test-invalid-env-contract.sh
