[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "music-kg-pipeline"
version = "0.1.0"
description = "Fixture-only worker CLI for the Music KG evidence service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx2[brotli,http2,zstd]>=2.9.1",
    "psycopg[binary]==3.2.10",
    "pyshacl==0.30.1",
    "rdflib==7.1.4",
    "typer==0.16.1",
]

[dependency-groups]
dev = [
  "basedpyright==1.31.4",
  "cyclonedx-bom==7.0.0",
  "pytest==8.4.2",
  "ruff==0.12.11",
  "testcontainers[postgres]==4.12.0",
]

[project.scripts]
music-kg-worker = "pipeline.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
markers = [
  "integration: requires Docker-backed PostgreSQL or pgvector infrastructure",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "S603"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PLR2004", "S101"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "all"
reportAny = "error"
reportExplicitAny = "error"
reportUnknownMemberType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
